<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZaminJob — AI Agro-Savdo va Xizmatlar</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --b2: #F5F6F4;
      --gl: #EAF1EC;
      --g1: #123D2B;
      --g2: #1D5A3D;
      --ink: #17211B;
      --mut: #707A73;
      --ln: #E5EAE6;
      --on: #fff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light;
    }

    :root[data-theme=dark] {
      color-scheme: dark;
      --bg: #0f1512;
      --b2: #161e19;
      --gl: #1b2a21;
      --g1: #7fc9a0;
      --g2: #5fb085;
      --ink: #e8efe9;
      --mut: #9aa69e;
      --ln: #26332b;
      --on: #0f1512;
    }

    :root[data-theme=dark] .err { color: #ff8a80; }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 16px/1.55 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 30;
    }

    a { color: inherit; text-decoration: none; }
    h1, h2, h3 { line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.02em; }
    h1 { font-size: clamp(2rem, 4.8vw, 3.6rem); font-weight: 800; max-width: 15em; }
    h2 { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 800; }
    h3 { font-size: 1.08rem; font-weight: 700; }
    p { margin: 0 0 1em; max-width: 62ch; }

    .w { max-width: 1140px; margin: 0 auto; padding: 0 20px; }
    section { padding: 56px 0; }

    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--ln);
    }

    .nav { display: flex; align-items: center; gap: 18px; height: 64px; }
    .logo { font-weight: 800; font-size: 1.24rem; color: var(--g1); letter-spacing: -.04em; white-space: nowrap; }
    .logo b { color: var(--g2); font-weight: 600; }

    .lks, .acts { display: flex; align-items: center; }
    .lks { gap: 20px; }
    .acts { gap: 14px; }

    nav { display: flex; gap: 18px; margin-left: auto; align-items: center; }
    nav a {
      font-size: .88rem;
      font-weight: 600;
      color: var(--mut);
      white-space: nowrap;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
    }
    nav a:hover { color: var(--ink); }
    nav a.on { color: var(--g1); border-bottom-color: var(--g1); }

    .ctl { display: flex; gap: 4px; align-items: center; margin-left: 8px; }
    .ctl button {
      background: none;
      border: 0;
      color: var(--mut);
      border-radius: 8px;
      height: 32px;
      min-width: 32px;
      padding: 0 7px;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .ctl button:hover { background: var(--b2); color: var(--ink); }
    .ctl button[aria-pressed=true] { background: var(--gl); color: var(--g1); }

    .burger { display: none; margin-left: auto; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--g1);
      background: var(--g1);
      color: var(--on);
      padding: 11px 20px;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      font-size: .92rem;
      cursor: pointer;
      transition: background .2s, opacity .15s;
    }
    .btn:hover { background: var(--g2); }
    .btn.o { background: transparent; color: var(--g1); }
    .btn.o:hover { background: var(--gl); }
    .btn.s { padding: 7px 13px; font-size: .84rem; }
    .acts .btn { padding: 8px 14px; font-size: .84rem; white-space: nowrap; }

    :focus-visible { outline: 2px solid var(--g2); outline-offset: 2px; }

    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
    .st { display: grid; gap: 12px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .card {
      border: 1px solid var(--ln);
      border-radius: 12px;
      padding: 20px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      transition: border-color .2s;
    }
    .card:hover { border-color: var(--g2); }
    .card h3 { margin: 0; }

    .tag {
      display: inline-block;
      background: var(--gl);
      color: var(--g1);
      border-radius: 99px;
      padding: 2px 10px;
      font-size: .76rem;
      font-weight: 700;
    }
    .tag.d { background: var(--b2); color: var(--mut); }
    .tag.ai { background: var(--g1); color: var(--on); }

    .mut { color: var(--mut); font-size: .9rem; }
    .demo {
      background: var(--b2);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--mut);
      font-size: .85rem;
      margin: 12px 0;
      max-width: none;
    }

    input, select, textarea {
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--g2); }
    input[aria-invalid=true], select[aria-invalid=true], textarea[aria-invalid=true] { border-color: #b3261e; }
    label { font-size: .85rem; font-weight: 600; display: block; margin: 12px 0 4px; }
    .err { color: #b3261e; font-size: .8rem; min-height: 1.1em; }

    .bar {
      display: grid;
      gap: 10px;
      grid-template-columns: 2fr repeat(auto-fit, minmax(150px, 1fr));
      margin: 20px 0 28px;
    }

    .av {
      width: 48px;
      height: 48px;
      flex: none;
      border-radius: 50%;
      background: var(--gl);
      color: var(--g1);
      display: grid;
      place-items: center;
      font-weight: 800;
    }
    .av.l { width: 84px; height: 84px; font-size: 1.6rem; }

    .hero {
      background: var(--bg);
      border-bottom: 1px solid var(--ln);
      position: relative;
      overflow: hidden;
      padding: 72px 0 64px;
    }
    .hero svg { position: absolute; right: 0; bottom: 0; width: 55%; color: var(--g2); opacity: .28; pointer-events: none; }
    .hero .w { position: relative; }
    .hero p { font-size: 1.1rem; color: var(--mut); }

    /* AI Box */
    .ai-box {
      margin-top: 24px;
      background: var(--bg);
      border: 1.5px solid var(--g1);
      border-radius: 14px;
      padding: 16px;
      max-width: 860px;
    }
    .ai-row { display: flex; gap: 10px; }
    .ai-row input { flex: 1; }
    .ai-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .ai-chip {
      background: var(--b2);
      border: 1px solid var(--ln);
      color: var(--ink);
      border-radius: 99px;
      padding: 5px 12px;
      font: inherit;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .ai-chip:hover { border-color: var(--g1); color: var(--g1); background: var(--gl); }
    .ai-res { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--ln); }
    .ai-msg {
      background: var(--gl);
      color: var(--g1);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: .88rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .tbl-w { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--ln); }
    th { color: var(--mut); font-size: .78rem; font-weight: 700; }

    .offer-pre {
      background: var(--b2);
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      max-height: 270px;
      overflow: auto;
      width: 100%;
    }
    .adv-box {
      background: var(--gl);
      color: var(--g1);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .84rem;
      margin-top: 8px;
    }

    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--ln); overflow-x: auto; margin: 16px 0 22px; }
    .tabs button {
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      font-size: .9rem;
      color: var(--mut);
      cursor: pointer;
      white-space: nowrap;
    }
    .tabs [aria-selected=true] { color: var(--g1); border-bottom-color: var(--g1); }

    .pb { height: 8px; background: var(--gl); border-radius: 9px; width: 100%; }
    .pb i { display: block; height: 100%; background: var(--g2); border-radius: 9px; }
    .num { font-size: 2rem; font-weight: 800; color: var(--g1); }

    .alt { background: var(--bg); border-top: 1px solid var(--ln); }

    [data-a=chip] {
      border-color: var(--ln);
      color: var(--ink);
      font-weight: 500;
      font-size: .88rem;
      padding: 8px 16px;
      border-radius: 99px;
    }
    [data-a=chip]:hover { border-color: var(--g1); background: var(--gl); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: grid;
      place-items: center;
      z-index: 50;
      padding: 16px;
    }
    .modal > div {
      background: var(--bg);
      border: 1px solid var(--ln);
      border-radius: 14px;
      padding: 24px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
    }

    #toast {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--g1);
      color: var(--on);
      padding: 10px 18px;
      border-radius: 10px;
      z-index: 60;
      font-size: .9rem;
      max-width: 90vw;
    }

    footer { background: var(--bg); border-top: 1px solid var(--ln); padding: 36px 0; }

    @media (min-width: 1081px) {
      nav { display: contents; }
      .nav { height: 72px; gap: 22px; }
      .lks { margin: 0 auto; order: 1; }
      .ctl { order: 2; margin: 0; }
      .acts { order: 3; }
      .burger { order: 4; }
    }

    @media (min-width: 861px) {
      .stats { grid-template-columns: repeat(4, 1fr); gap: 0; }
      .stats > div { padding: 4px 24px; border-left: 1px solid var(--ln); }
      .stats > div:first-child { border: 0; padding-left: 0; }
      .num { font-size: 2.3rem; letter-spacing: -.03em; }
    }

    @media (max-width: 860px) {
      .burger { display: block; margin-left: 0; order: 4; }
      .ctl { margin-left: auto; }
      nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        background: var(--bg);
        padding: 8px 20px 20px;
        border-bottom: 1px solid var(--ln);
        box-shadow: 0 12px 24px rgba(0, 0, 0, .08);
      }
      nav.open { display: flex; }
      .lks { flex-direction: column; align-items: stretch; gap: 0; }
      .lks a { font-size: 1rem; padding: 12px 0; border-bottom: 1px solid var(--ln); }
      .acts { flex-direction: column; align-items: stretch; gap: 10px; margin-top: 14px; }
      .ai-row { flex-direction: column; }
      .stats { grid-template-columns: 1fr 1fr; }
      .bar { grid-template-columns: 1fr 1fr; }
      .bar input { grid-column: 1 / -1; }
      .modal { align-items: end; padding: 0; }
      .modal > div { border-radius: 18px 18px 0 0; max-height: 92vh; padding: 20px 16px; }
      footer .w { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="w nav">
      <a class="logo" href="#home">Zamin<b>Job</b></a>
      <nav id="nav"></nav>
      <div class="ctl">
        <button data-a="lg" data-i="ru" id="lr">RU</button>
        <button data-a="lg" data-i="uz" id="lu">UZ</button>
        <button data-a="th" id="th"></button>
      </div>
      <button class="burger btn o s" data-a="burger" id="bg"></button>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    <div class="w row" style="justify-content:space-between;align-items:flex-start;gap:24px">
      <div>
        <div class="logo">Zamin<b>Job</b></div>
        <p class="mut">AI агро-торговля, экспорт, земля и услуги на земле.</p>
      </div>
      <p class="mut">Демонстрационный MVP: все профили, лоты, вакансии и цифры вымышлены. Реальные платежи и интеграции подключаются на следующем этапе.</p>
    </div>
  </footer>

  <div id="toast" role="status" hidden></div>

        </div>
        <div class="acts">
          ${me() ? '<a href="#dashboard">Кабинет</a><a href="#home" data-a="out">Выйти</a>' : '<a href="#login">Войти</a>'}
          <button class="btn s" data-a="addlot">Разместить вакансию</button>
        </div>`;
      document.documentElement.dataset.theme = S.th;
      document.documentElement.lang = S.lg;
      const ft = $('footer');
      ft.dataset.o = ft.dataset.o || ft.innerHTML;
      ft.innerHTML = ft.dataset.o;
      $('#lr').setAttribute('aria-pressed', S.lg == 'ru');
      $('#lu').setAttribute('aria-pressed', S.lg == 'uz');
      $('#th').innerHTML = S.th == 'dark' ? SUN : MOON;
      $('#th').setAttribute('aria-label', tr(S.th == 'dark' ? 'Светлая тема' : 'Тёмная тема'));
      $('#bg').textContent = tr('Меню');
      ['#app', '#nav', 'footer'].forEach(s => tx($(s)));
      document.title = S.lg == 'uz' ? 'ZaminJob — AI Agro-Savdo va Xizmatlar' : 'ZaminJob — AI Агро-торговля и услуги';
      if (!keep) scrollTo(0, 0);
    };

    const tg = (k, i) => {
      const a = S[k], x = a.indexOf(i);
      x < 0 ? a.push(i) : a.splice(x, 1);
      save();
      toast(x < 0 ? "Добавлено в сохранённые" : "Убрано из сохранённых");
      draw(1);
    };

    const A = {
      lg: i => { S.lg = i; S.lgv = 1; save(); draw(1); },
      th: () => { S.th = S.th == 'dark' ? 'light' : 'dark'; save(); draw(1); },
      pro: () => { S.pro = S.pro ? 0 : 1; save(); toast(S.pro ? "PRO Активен" : "Демо"); draw(1); },
      burger: () => $("#nav").classList.toggle("open"),
      close,
      sj: i => tg("sj", i),
      sw: i => tg("sw", i),
      tab: i => { DT = i; draw(1); },
      role: i => { RR = i; draw(1); },
      chip: i => { FS.j = { q: "", rg: "", sp: String(i), pay: "0", ty: "", so: "new" }; },
      aichip: (i, b) => { AIQ = b.dataset.t; AIR = aiMatch(AIQ); draw(1); },
      aioffer: i => openAiOffer(i),
      addlot: () => lotForm(),
      addland: () => landForm(),
      rfq: (i, b) => modal(`
        <h2>Запрос / RFQ</h2>
        <p class="mut"><b>${esc(b.dataset.t)}</b></p>
        <form data-s="rfq" novalidate>
          <input type="hidden" name="t" value="${esc(b.dataset.t)}">
          ${fld("ph", "Телефон", "tel", PHX)}
          <label for="msg">Сообщение</label><textarea id="msg" name="msg" rows="3"></textarea><div class="err" data-e="msg"></div>
          <div class="row" style="margin-top:12px"><button class="btn">Отправить</button><button type="button" class="btn o" data-a="close">Отмена</button></div>
        </form>`),
      out: () => { S.in = 0; DT = 0; save(); toast("Вы вышли из аккаунта"); draw(); },
      delv: i => { S.vc = S.vc.filter(j => j.id != i); save(); toast("Вакансия закрыта"); draw(1); },
      job: i => {
        const j = allJ().find(x => x.id == i);
        modal(`<h2>${j.t}</h2><p class="mut">${j.em} · ${REG[j.rg]}</p><div class="row"><span class="tag">${SP[j.sp]}</span><span class="tag">${j.ty}</span></div><p style="margin-top:14px">${(S.lg == 'uz' && JDU[j.id - 1]) || j.d}</p><p><b>${pay(j)}</b></p><div class="row"><button class="btn" data-a="apply" data-i="${i}">Откликнуться</button><button class="btn o" data-a="close">Закрыть</button></div>`);
      },
      apply: i => {
        const u = me();
        if (!u) { close(); location.hash = "login"; return; }
        if (!S.ap.includes(i)) S.ap.push(i);
        save(); close(); toast("Отклик отправлен (демо)"); draw(1);
      },
      post: () => {
        const u = me();
        if (!u) { RR = "f"; location.hash = "register"; draw(1); }
        else vacForm();
      },
      msg: (i, b) => modal(`<h2>Связаться: ${b.dataset.t}</h2><form data-s="msg" novalidate><label for="msg">Сообщение</label><textarea id="msg" name="msg" rows="4"></textarea><div class="err" data-e="msg"></div><div class="row" style="margin-top:12px"><button class="btn">Отправить</button><button type="button" class="btn o" data-a="close">Отмена</button></div></form>`)
    };

    const g = (f, k) => esc(f.elements[k].value.trim());

    const H = {
      ai: f => {
        const q = f.elements.q.value.trim();
        if (!q) return;
        AIQ = q;
        AIR = aiMatch(q);
        draw(1);
      },
      rfq: f => {
        if (!chk(f, { ph: [PH, "Формат: +998 90 123 45 67"], msg: [/.{5,}/, "Минимум 6 символов"] })) return;
        S.rfq.unshift({ t: f.elements.t.value, m: g(f, "ph") + " · " + g(f, "msg"), dt: new Date().toISOString().slice(0, 10) });
        save(); close(); toast("Запрос сохранён в кабинете");
      },
      lot: f => {
        if (!chk(f, { t: [/.{3,}/, "Минимум 3 символа"], farm: [/.{2,}/, "Введите название хозяйства"], rg: [/\d/, "Выберите регион"] })) return;
        S.ul.unshift({
          id: 500 + Date.now() % 10000, crop: f.elements.crop.value, rg: +f.elements.rg.value,
          tons: +f.elements.tons.value || 10, priceUsd: +f.elements.usd.value || 1.2, incoterm: "EXW", gap: 0,
          farm: g(f, "farm"), grade: "Class A", harvest: "Mavjud", t: g(f, "t"), pack: "Eksport qadoqlash"
        });
        save(); close(); toast("Лот опубликован"); location.hash = "trade"; draw();
      },
      land: f => {
        if (!chk(f, { t: [/.{3,}/, "Минимум 3 символа"], rg: [/\d/, "Выберите регион"] })) return;
        S.uland.unshift({
          id: 600 + Date.now() % 10000, rg: +f.elements.rg.value, type: f.elements.type.value,
          area: g(f, "area") || "2 га", deal: "Партнёрство 50/50 или аренда", price: g(f, "price") || "По договорённости",
          owner: me() ? S.u.x || S.u.fn : "Фермерское хозяйство", water: g(f, "water") || "Капельный полив", t: g(f, "t")
        });
        save(); close(); toast("Объявление о земле опубликовано"); location.hash = "lands"; draw();
      },
      login: f => {
        if (!chk(f, { ph: [PH, "Формат: +998 90 123 45 67"], pw: [/.{6,}/, "Минимум 6 символов"] })) return;
        const p = v => v.replace(/\s/g, "");
        if (!S.u || p(S.u.ph) != p(f.elements.ph.value)) {
          f.querySelector("[data-e=ph]").textContent = tr('Аккаунт не найден. Это демо: сначала зарегистрируйтесь.');
          return;
        }
        S.in = 1; DT = 0; save(); location.hash = "dashboard";
      },
      reg: f => {
        const fm = RR == "f";
        if (!chk(f, { fn: [/.{2,}/, "Введите имя"], ph: [PH, "Формат: +998 90 123 45 67"], rg: [/\d/, "Выберите регион"], x: [fm ? /.{2,}/ : /\d/, fm ? "Введите название хозяйства" : "Выберите специальность"], pw: [/.{6,}/, "Минимум 6 символов"] })) return;
        S.u = { role: RR, fn: g(f, "fn"), ph: g(f, "ph"), rg: g(f, "rg"), x: g(f, "x") };
        S.in = 1; DT = 0; save(); toast("Аккаунт создан (демо)"); location.hash = "dashboard";
      },
      vac: f => {
        if (!chk(f, { t: [/.{3,}/, "Минимум 3 символа"], sp: [/\d/, "Выберите специальность"], rg: [/\d/, "Выберите регион"], pay: [/^\d{6,8}$/, "Укажите сумму от 100 000"], d: [/.{10,}/, "Опишите работу минимум в 10 символов"] })) return;
        S.vc.push({ id: 100 + Date.now() % 100000, t: g(f, "t"), sp: +f.elements.sp.value, rg: +f.elements.rg.value, pay: Math.round(f.elements.pay.value / 1000), ty: g(f, "ty"), em: S.u.x, d: g(f, "d") });
        save(); close(); DT = 0; toast("Вакансия опубликована (демо)"); draw(1);
      },
      pf: f => {
        if (!chk(f, { fn: [/.{2,}/, "Введите имя"], rg: [/\d/, "Выберите регион"], x: [/\d/, "Выберите специальность"], ex: [/^\d{0,2}$/, "Укажите число лет"] })) return;
        Object.assign(S.u, { fn: g(f, "fn"), rg: g(f, "rg"), x: g(f, "x"), ex: g(f, "ex"), sk: g(f, "sk"), bio: g(f, "bio") });
        save(); toast("Профиль сохранён"); draw(1);
      },
      msg: f => {
        if (!chk(f, { msg: [/.{10,}/, "Напишите минимум 10 символов"] })) return;
        close(); toast("Сообщение принято (демо, никуда не отправлено)");
      }
    };

    document.addEventListener("click", e => {
      const b = e.target.closest("[data-a]");
      if (!b) return;
      const n = +b.dataset.i;
      A[b.dataset.a]?.(isNaN(n) ? b.dataset.i : n, b);
    });

    document.addEventListener("submit", e => {
      e.preventDefault();
      H[e.target.dataset.s]?.(e.target);
    });

    addEventListener("input", e => {
      const t = e.target, k = t.dataset.g;
      if (t.name == "ph") { t.value = fmtPh(t.value); return; }
      if (!k) return;
      FS[k][t.dataset.f] = t.value;
      const fn = k == 'j' ? jobList : k == 'w' ? wList : k == 't' ? tradeList : landList;
      $('#list').innerHTML = fn();
      tx($('#list'));
    });

    addEventListener("hashchange", () => draw());
    draw();
  </script>
</body>
</html>
