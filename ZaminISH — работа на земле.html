<section><div class="w"><div class="card" style="background:var(--gl);padding:40px"><h2>Начните сегодня</h2><p>Зарегистрируйтесь как фермер или работник и попробуйте демо-версию.</p><a class="btn" href="#register">Создать аккаунт</a></div></div></section>`;
V.jobs=()=>`<section><div class="w"><h2>Найти работу</h2><div class="bar"><input data-g="j" data-f="q" placeholder="Поиск по названию" aria-label="Поиск по названию"><select data-g="j" data-f="rg" aria-label="Регион"><option value="">Все регионы</option>${O(REG)}</select><select data-g="j" data-f="sp" aria-label="Специальность"><option value="">Все специальности</option>${O(SP)}</select><select data-g="j" data-f="pay" aria-label="Зарплата"><option value="0">Любая зарплата</option><option value="3500">от 3 500 000</option><option value="4500">от 4 500 000</option><option value="5500">от 5 500 000</option></select><select data-g="j" data-f="ty" aria-label="Тип занятости"><option value="">Любая занятость</option><option>Сезонная</option><option>Постоянная</option></select><select data-g="j" data-f="so" aria-label="Сортировка"><option value="new">Сначала новые</option><option value="hi">Зарплата выше</option><option value="lo">Зарплата ниже</option></select></div><div class="grid" id="list">${jobList()}</div></div></section>`;
V.workers=()=>`<section><div class="w"><h2>Найти работников</h2><div class="bar"><input data-g="w" data-f="q" placeholder="Имя или навык" aria-label="Поиск"><select data-g="w" data-f="rg" aria-label="Регион"><option value="">Все регионы</option>${O(REG)}</select><select data-g="w" data-f="sp" aria-label="Специальность"><option value="">Все специальности</option>${O(SP)}</select><select data-g="w" data-f="av" aria-label="Доступность"><option value="">Любая доступность</option><option>Доступен сейчас</option><option>С 1 декабря</option><option>С февраля</option></select></div><div class="grid" id="list">${wList()}</div></div></section>`;
V.worker=id=>{const w=W[id-1];if(!w)return nf();return `<section><div class="w"><a class="mut" href="#workers">← Все работники</a><p class="demo">Агро-Паспорт — демонстрационный. Человек вымышлен, подтверждения и отзывы имитируются, настоящей проверки нет.</p><div class="row" style="gap:20px;margin:16px 0"><div class="av l">${ini(w.n)}</div><div><h2 style="margin:0">${w.n}</h2><div class="mut">${REG[w.rg]} · ${SP[w.sp]}</div></div></div><div class="row"><button class="btn" data-a="msg" data-t="${w.n}">Связаться</button><button class="btn o" data-a="sw" data-i="${w.id}">${S.sw.includes(w.id)?"Сохранён":"Сохранить"}</button></div><div class="grid" style="margin-top:28px"><div class="card"><h3>Основное</h3><div>Опыт: ${w.ex} ${yr(w.ex)}</div><div>Доступность: ${w.av}</div><div>Уровень: <span class="tag">${lvl(w.jb)}</span> <span class="tag d">демо</span></div><div class="mut">Выполнено работ: ${w.jb} (демо)</div></div><div class="card"><h3>Навыки</h3><div class="row">${w.sk.map(s=>`<span class="tag">${s}</span>`).join("")}</div></div><div class="card"><h3>Квалификации</h3><div class="mut">Профильный курс — запись демонстрационная, не проверена. Государственной верификации нет.</div></div></div><h3 style="margin-top:28px">Выполненные работы (демо)</h3><div class="st">${[0,1,2].map(k=>{const j=J[(id+k*3)%12];return `<div class="card">${j.em}: ${j.t.toLowerCase()}, ${2025-k}</div>`}).join("")}</div><h3 style="margin-top:28px">Отзывы работодателей (демо)</h3><div class="st">${[id%3,(id+1)%3].map((r,k)=>`<div class="card"><div>${RV[r]}</div><div class="mut">${J[(id+k)%12].em}</div></div>`).join("")}</div></div></section>`};
V.brigades=()=>`<section><div class="w"><h2>Бригады</h2><p class="mut">Готовые команды для крупных сезонных работ.</p><div class="grid">${B.map(bCard).join("")}</div></div></section>`;
V.brigade=id=>{const b=B[id-1];if(!b)return nf();return `<section><div class="w"><a class="mut" href="#brigades">← Все бригады</a><p class="demo">Демонстрационная бригада: состав и данные вымышлены.</p><h2>${b.n}</h2><div class="row"><span class="tag">${SP[b.sp]}</span><span class="tag">${REG[b.rg]}</span></div><p style="margin-top:16px">${b.d}</p><div class="grid"><div class="card"><h3>Состав</h3><div>${b.size} человек</div><div class="mut">Бригадир: ${b.ld}</div></div><div class="card"><h3>Опыт и доступность</h3><div>Опыт: ${b.ex}</div><div>${b.av}</div></div></div><br><button class="btn" data-a="msg" data-t="${b.n}">Запросить бригаду</button></div></section>`};
V.about=()=>`<section><div class="w" style="max-width:760px"><h1>О платформе</h1>${[["Зачем нужна платформа","Сельскохозяйственная работа в Узбекистане часто строится на личных знакомствах. Фермеру сложно быстро найти людей к сезону, а работнику — узнать, где ищут именно его."],["Какую проблему решает","ZaminISH собирает вакансии, профили и бригады в одном месте, чтобы поиск занимал часы, а не недели."],["Пользу для фермеров","Единый каталог работников и готовых бригад, понятные профили и отклики в одном кабинете."],["Пользу для работников","Agro-Паспорт показывает навыки и опыт, а будущая история подтверждённых работ поможет вырасти в уровне."],["Видение","Доверительный рынок аграрного труда, где репутация строится на реально выполненных работах."]].map(s=>`<h2 style="margin-top:36px">${s[0]}</h2><p>${s[1]}</p>`).join("")}<p class="demo">Сейчас это демонстрационный MVP. Реальных платежей, защиты оплаты и государственной верификации нет.</p></div></section>`;
V.login=()=>`<section><div class="w" style="max-width:440px"><h2>Вход</h2><p class="demo">Демо: данные хранятся только в вашем браузере, настоящей авторизации нет.</p><form data-s="login" novalidate>${fld("ph","Телефон","tel",'placeholder="+998 90 123 45 67"')}${fld("pw","Пароль","password")}<button class="btn" style="width:100%;margin-top:12px">Войти</button></form><p class="mut" style="margin-top:16px">Нет аккаунта? <a href="#register" style="color:var(--g1);font-weight:700">Регистрация</a></p></div></section>`;
V.register=()=>`<section><div class="w" style="max-width:480px"><h2>Регистрация</h2><div class="tabs"><button data-a="role" data-i="f" aria-selected="${RR=="f"}">Фермер / Работодатель</button><button data-a="role" data-i="w" aria-selected="${RR=="w"}">Работник</button></div><form data-s="reg" novalidate>${fld("fn",RR=="f"?"Контактное лицо":"Имя и фамилия")}${fld("ph","Телефон","tel",'placeholder="+998 90 123 45 67"')}${sel("rg","Регион",O(REG))}${RR=="f"?fld("x","Название хозяйства"):sel("x","Специальность",O(SP))}${fld("pw","Пароль (от 6 символов)","password")}<button class="btn" style="width:100%;margin-top:12px">Создать аккаунт</button></form></div></section>`;
const nf=()=>`<section><div class="w"><div class="grid">${em("Страница не найдена","Проверьте адрес или вернитесь на главную.",'<a class="btn" href="#home">На главную</a>')}</div></div></section>`;
const pc=u=>40+15*[u.x,u.ex,u.sk,u.bio].filter(Boolean).length;
const vacForm=()=>modal(`<h2>Новая вакансия</h2><form data-s="vac" novalidate>${fld("t","Название")}${sel("sp","Специальность",O(SP))}${sel("rg","Регион",O(REG))}${fld("pay","Зарплата, сум в месяц","number",'placeholder="4000000"')}<label for="ty">Тип занятости</label><select id="ty" name="ty"><option>Сезонная</option><option>Постоянная</option></select><label for="d">Описание</label><textarea id="d" name="d" rows="3"></textarea><div class="err" data-e="d"></div><div class="row" style="margin-top:12px"><button class="btn">Опубликовать</button><button type="button" class="btn o" data-a="close">Отмена</button></div></form>`);
const pfForm=u=>`<form data-s="pf" novalidate>${fld("fn","Имя и фамилия","text",`value="${u.fn}"`)}${sel("rg","Регион",O(REG,u.rg))}${sel("x","Специальность",O(SP,u.x))}${fld("ex","Опыт, лет","text",`value="${u.ex||""}"`)}${fld("sk","Навыки через запятую","text",`value="${u.sk||""}"`)}<label for="bio">О себе</label><textarea id="bio" name="bio" rows="3">${u.bio||""}</textarea><button class="btn" style="margin-top:12px">Сохранить профиль</button></form>`;
const D={f:[()=>`<button class="btn" data-a="post">Создать вакансию</button><br><br>`+(S.vc.length?`<div class="st">${S.vc.map(j=>`<div class="card"><h3>${j.t}</h3><div class="mut">${REG[j.rg]} · ${pay(j)}</div><button class="btn o s" data-a="delv" data-i="${j.id}">Закрыть вакансию</button></div>`).join("")}</div>`:`<div class="grid">${em("Пока нет вакансий","Создайте первую — она появится в разделе «Найти работу».")}</div>`),
()=>S.vc.length?`<p class="demo">Демо: отклики подставлены для примера.</p><div class="grid">${W.slice(0,3).map(wCard).join("")}</div>`:`<div class="grid">${em("Откликов пока нет","Они появятся после публикации вакансии.")}</div>`,
()=>`<div class="grid">${S.sw.length?S.sw.map(i=>wCard(W[i-1])).join(""):em("Нет сохранённых работников","Нажмите «Сохранить» в каталоге работников.",'<a class="btn" href="#workers">Открыть каталог</a>')}</div>`,
()=>`<p class="demo">Демо: настоящей истории найма пока нет.</p><div class="grid">${[3,5].map(i=>wCard(W[i])).join("")}</div>`],
w:[u=>`<div class="card" style="width:100%"><h3>Профиль заполнен на ${pc(u)}%</h3><div class="pb"><i style="width:${pc(u)}%"></i></div><p class="mut">Добавьте опыт, навыки и описание во вкладке «Профиль».</p></div><h3 style="margin:28px 0 14px">Рекомендуемые вакансии</h3><div class="grid">${[...new Set(allJ().filter(j=>j.sp==u.x).concat(allJ()))].slice(0,3).map(jobCard).join("")}</div>`,
()=>`<div class="grid">${S.ap.length?jl(S.ap).map(jobCard).join(""):em("Откликов пока нет","Откликнитесь на вакансию, и она появится здесь.",'<a class="btn" href="#jobs">Найти работу</a>')}</div>`,
()=>`<div class="grid">${S.sj.length?jl(S.sj).map(jobCard).join(""):em("Нет сохранённых вакансий","Нажмите «Сохранить» на карточке вакансии.",'<a class="btn" href="#jobs">Найти работу</a>')}</div>`,
u=>`<p class="demo">История работ: подтверждённых работ пока нет. В реальной версии они появятся после найма.</p>${pfForm(u)}`]};
V.dashboard=()=>{const u=me();if(!u)return `<section><div class="w"><div class="grid">${em("Нужен вход","Войдите, чтобы открыть кабинет.",'<a class="btn" href="#login">Войти</a>')}</div></div></section>`;const f=u.role=="f",T=f?["Вакансии","Отклики","Сохранённые работники","Нанятые ранее"]:["Обзор","Отклики","Сохранённые вакансии","Профиль"];return `<section><div class="w"><h2>${f?"Кабинет фермера":"Кабинет работника"}</h2><div class="mut">${u.fn}${f?" · "+u.x:""}</div><div class="tabs" role="tablist">${T.map((t,i)=>`<button role="tab" aria-selected="${i==DT}" data-a="tab" data-i="${i}">${t}</button>`).join("")}</div>${D[u.role][DT](u)}</div></section>`};
const draw=keep=>{const[p,id]=(location.hash.slice(1)||"home").split("-");$("#app").innerHTML=(V[p]||nf)(+id);document.querySelectorAll("[data-f]").forEach(el=>el.value=FS[el.dataset.g][el.dataset.f]);$("#nav").innerHTML=[["home","Главная"],["jobs","Найти работу"],["workers","Найти работников"],["brigades","Бригады"],["about","О платформе"]].map(a=>`<a href="#${a[0]}"${a[0]==p?' class="on"':""}>${a[1]}</a>`).join("")+(me()?'<a href="#dashboard">Кабинет</a><a href="#home" data-a="out">Выйти</a>':'<a href="#login">Войти</a>')+'<button class="btn s" data-a="post">Разместить вакансию</button>';if(!keep)scrollTo(0,0)};
const tg=(k,i)=>{const a=S[k],x=a.indexOf(i);x<0?a.push(i):a.splice(x,1);save();toast(x<0?"Добавлено в сохранённые":"Убрано из сохранённых");draw(1)};
const A={burger:()=>$("#nav").classList.toggle("open"),close,sj:i=>tg("sj",i),sw:i=>tg("sw",i),tab:i=>{DT=i;draw(1)},role:i=>{RR=i;draw(1)},
chip:i=>{FS.j={q:"",rg:"",sp:String(i),pay:"0",ty:"",so:"new"}},
out:()=>{S.in=0;DT=0;save();toast("Вы вышли из аккаунта");draw()},
delv:i=>{S.vc=S.vc.filter(j=>j.id!=i);save();toast("Вакансия закрыта");draw(1)},
job:i=>{const j=allJ().find(x=>x.id==i);modal(`<h2>${j.t}</h2><p class="mut">${j.em} · ${REG[j.rg]}</p><div class="row"><span class="tag">${SP[j.sp]}</span><span class="tag">${j.ty}</span></div><p style="margin-top:14px">${j.d}</p><p><b>${pay(j)}</b></p><div class="row"><button class="btn" data-a="apply" data-i="${i}">Откликнуться</button><button class="btn o" data-a="close">Закрыть</button></div>`)},
apply:i=>{const u=me();if(!u){close();toast("Войдите как работник, чтобы откликнуться");location.hash="login";return}if(u.role!="w"){toast("Откликаться могут работники");return}if(S.ap.includes(i)){toast("Вы уже откликнулись");return}S.ap.push(i);save();close();toast("Отклик отправлен (демо)");draw(1)},
post:()=>{const u=me();if(!u){RR="f";toast("Зарегистрируйтесь как работодатель");location.hash="register";draw(1)}else if(u.role!="f")toast("Вакансии размещают работодатели");else vacForm()},
msg:(i,b)=>modal(`<h2>Связаться: ${b.dataset.t}</h2><p class="demo">Демо: сообщение никуда не отправляется, контакты не раскрываются.</p><form data-s="msg" novalidate><label for="msg">Сообщение</label><textarea id="msg" name="msg" rows="4"></textarea><div class="err" data-e="msg"></div><div class="row" style="margin-top:12px"><button class="btn">Отправить</button><button type="button" class="btn o" data-a="close">Отмена</button></div></form>`)};
const g=(f,k)=>esc(f.elements[k].value.trim()),H={
login:f=>{if(!chk(f,{ph:[PH,"Формат: +998 90 123 45 67"],pw:[/.{6,}/,"Минимум 6 символов"]}))return;const p=v=>v.replace(/\s/g,"");if(!S.u||p(S.u.ph)!=p(f.elements.ph.value)){f.querySelector("[data-e=ph]").textContent="Аккаунт не найден. Это демо: сначала зарегистрируйтесь.";return}S.in=1;DT=0;save();location.hash="dashboard"},
reg:f=>{const fm=RR=="f";if(!chk(f,{fn:[/.{2,}/,"Введите имя"],ph:[PH,"Формат: +998 90 123 45 67"],rg:[/\d/,"Выберите регион"],x:[fm?/.{2,}/:/\d/,fm?"Введите название хозяйства":"Выберите специальность"],pw:[/.{6,}/,"Минимум 6 символов"]}))return;S.u={role:RR,fn:g(f,"fn"),ph:g(f,"ph"),rg:g(f,"rg"),x:g(f,"x")};S.in=1;DT=0;save();toast("Аккаунт создан (демо)");location.hash="dashboard"},
vac:f=>{if(!chk(f,{t:[/.{3,}/,"Минимум 3 символа"],sp:[/\d/,"Выберите специальность"],rg:[/\d/,"Выберите регион"],pay:[/^\d{6,8}$/,"Укажите сумму от 100 000"],d:[/.{10,}/,"Опишите работу минимум в 10 символов"]}))return;S.vc.push({id:100+Date.now()%100000,t:g(f,"t"),sp:+f.elements.sp.value,rg:+f.elements.rg.value,pay:Math.round(f.elements.pay.value/1000),ty:g(f,"ty"),em:S.u.x,d:g(f,"d")});save();close();DT=0;toast("Вакансия опубликована (демо)");draw(1)},
pf:f=>{if(!chk(f,{fn:[/.{2,}/,"Введите имя"],rg:[/\d/,"Выберите регион"],x:[/\d/,"Выберите специальность"],ex:[/^\d{0,2}$/,"Укажите число лет"]}))return;Object.assign(S.u,{fn:g(f,"fn"),rg:g(f,"rg"),x:g(f,"x"),ex:g(f,"ex"),sk:g(f,"sk"),bio:g(f,"bio")});save();toast("Профиль сохранён");draw(1)},
msg:f=>{if(!chk(f,{msg:[/.{10,}/,"Напишите минимум 10 символов"]}))return;close();toast("Сообщение принято (демо, никуда не отправлено)")}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const n=+b.dataset.i;A[b.dataset.a]?.(isNaN(n)?b.dataset.i:n,b)});
document.addEventListener("submit",e=>{e.preventDefault();H[e.target.dataset.s]?.(e.target)});
addEventListener("input",e=>{const t=e.target,k=t.dataset.g;if(!k)return;FS[k][t.dataset.f]=t.value;$("#list").innerHTML=k=="j"?jobList():wList()});
addEventListener("hashchange",()=>draw());draw();
</script></body></html>
